<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1920" viewBox="0 0 1800 1920"><title>图解 41  两板四柱孔定位与实物描孔边界</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M 8 0 L 0 4 L 8 8" fill="none" stroke="#687c8b" stroke-width="1.2"/></marker><pattern id="hatch" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M-5,5 L5,-5 M0,20 L20,0 M15,25 L25,15" stroke="#dce3e8" stroke-width="2"/></pattern></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:34px} .small{font-size:32px} .bold{font-weight:700}</style><rect width="1800" height="1920" fill="white"/>
<text x="70" y="72" font-size="46px" style="font-size:46px" fill="#18344b" text-anchor="start" font-weight="700">图解 41  两板四柱孔定位与实物描孔边界</text>
<text x="70" y="128" font-size="34px" style="font-size:34px" fill="#687c8b" text-anchor="start" font-weight="400">从板件安装面俯视；车尾在左、车头在右。两板均用自身左下角为局部原点。</text>
