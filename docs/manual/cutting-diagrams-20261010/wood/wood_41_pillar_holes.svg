<text x="1246" y="1242" font-size="34px" style="font-size:34px" fill="#18344b" text-anchor="start" font-weight="400">(250, +85)</text>
<text x="80" y="1310" font-size="34px" style="font-size:34px" fill="#687c8b" text-anchor="start" font-weight="400">换算：yb = Y + 110；xp = X − 20；yp = yb − 15。X 向车头、Y 向舵机侧。</text>
<text x="80" y="1378" font-size="36px" style="font-size:36px" fill="#18344b" text-anchor="start" font-weight="700">灰 / 橙 / 绿虚线是试摆或定位参考，均不是钻孔或切槽模板</text>
<text x="80" y="1428" font-size="34px" style="font-size:34px" fill="#18344b" text-anchor="start" font-weight="400">① 电机支架先带轮试摆，参考轴心 X≈90；槽与转接孔只按实物覆盖范围描出。</text>
<text x="80" y="1478" font-size="34px" style="font-size:34px" fill="#18344b" text-anchor="start" font-weight="400">② 前万向球参考接地点 X≈240、Y≈0；固定孔距与转接片按实物，不能照圈钻。</text>
<text x="80" y="1528" font-size="34px" style="font-size:34px" fill="#18344b" text-anchor="start" font-weight="400">③ 桶壳在 P02 的局部左下角为 (50, 20)；外角码孔按实物，板面不切出矩形。</text>
<text x="80" y="1578" font-size="34px" style="font-size:34px" fill="#18344b" text-anchor="start" font-weight="400">电池每条绑带两侧各 1 槽，建议 24×4、长边沿 X；槽间距按电池，模块孔亦实描。</text>
<text x="80" y="1628" font-size="34px" style="font-size:34px" fill="#18344b" text-anchor="start" font-weight="400">舵机托片不可压住 H3 柱顶：按实物留检修孔 / 开口，再定位角码和托片固定孔。</text>
<rect x="80" y="1710" width="1640" height="145" fill="#eff5fa" stroke="none" stroke-width="0"/>
<text x="100" y="1756" font-size="34px" style="font-size:34px" fill="#18344b" text-anchor="start" font-weight="400">配钻顺序：① P01 测量标 4 孔并打导孔 → ② P02 按 (20, 15) 偏移夹牢</text>
<text x="100" y="1808" font-size="34px" style="font-size:34px" fill="#18344b" text-anchor="start" font-weight="400">→ ③ 配钻至 ⌀3.4，逐孔穿临时螺钉防滑；4 颗 M3 螺钉应能自然穿入。</text>
<text x="80" y="1894" font-size="32px" style="font-size:32px" fill="#687c8b" text-anchor="start" font-weight="400">成品外形目标误差 ±1 mm；本图非 1:1，不能直接打印贴板当钻孔模板。</text>
</svg>