<text x="45.00" y="71.76" font-size="48" fill="#17252E" font-weight="700" text-anchor="start">图解 42｜3 mm 发泡 PVC 排料：第一片裁主件，第二片备用</text>
<text x="45.00" y="134.32" font-size="36" fill="#566773" font-weight="400" text-anchor="start">单位 mm｜原料共 2 片 500×500×3；本图不含 2 mm 活动盖，也不含 PP 内胆。</text>
<text x="140.00" y="196.54" font-size="42" fill="#17252E" font-weight="700" text-anchor="start">第 1 片：按编号逐片划线</text>
