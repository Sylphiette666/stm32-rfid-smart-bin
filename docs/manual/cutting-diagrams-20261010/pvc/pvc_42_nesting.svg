<text x="575.60" y="500.93" font-size="39" fill="#B16916" font-weight="700" text-anchor="middle">144×180</text>
<rect x="149.00" y="632.00" width="288.00" height="324.00" fill="#E7F0F8" stroke="#17252E" stroke-width="3"/>
<text x="293.00" y="782.80" font-size="40" fill="#1565A6" font-weight="700" text-anchor="middle">P03 右侧壁</text>
<text x="293.00" y="834.80" font-size="40" fill="#1565A6" font-weight="700" text-anchor="middle">160×180</text>
<rect x="446.00" y="632.00" width="259.20" height="324.00" fill="#F7ECD9" stroke="#17252E" stroke-width="3"/>
<text x="575.60" y="782.93" font-size="39" fill="#B16916" font-weight="700" text-anchor="middle">P04 前壁</text>
<text x="575.60" y="833.93" font-size="39" fill="#B16916" font-weight="700" text-anchor="middle">144×180</text>
<rect x="714.20" y="299.00" width="277.20" height="259.20" fill="#E8F2EB" stroke="#17252E" stroke-width="3"/>
<text x="852.80" y="417.40" font-size="40" fill="#237655" font-weight="700" text-anchor="middle">P05 壳底</text>
<text x="852.80" y="469.40" font-size="40" fill="#237655" font-weight="700" text-anchor="middle">154×144</text>
<rect x="149.00" y="965.00" width="342.00" height="216.00" fill="#EEEAF5" stroke="#17252E" stroke-width="3"/>
<text x="320.00" y="1061.80" font-size="40" fill="#17252E" font-weight="700" text-anchor="middle">P07 操作板</text>
<text x="320.00" y="1113.80" font-size="40" fill="#17252E" font-weight="700" text-anchor="middle">190×120</text>
<rect x="500.00" y="965.00" width="324.00" height="45.00" fill="#F6E8E8" stroke="#17252E" stroke-width="3"/>
<text x="662.00" y="1000.08" font-size="34" fill="#17252E" font-weight="400" text-anchor="middle">P10 约180×25</text>
<rect x="500.00" y="1019.00" width="270.00" height="63.00" fill="#EBF3F3" stroke="#17252E" stroke-width="3"/>
<text x="635.00" y="1063.82" font-size="36" fill="#17252E" font-weight="400" text-anchor="middle">P08 150×35</text>
<rect x="500.00" y="1091.00" width="270.00" height="21.60" fill="#E3E7EC" stroke="#17252E" stroke-width="3"/>
<text x="870.00" y="699.06" font-size="38" fill="#566773" font-weight="400" text-anchor="middle">余料区</text>
<text x="870.00" y="749.06" font-size="38" fill="#566773" font-weight="400" text-anchor="middle">保留试切、</text>
<text x="870.00" y="799.06" font-size="38" fill="#566773" font-weight="400" text-anchor="middle">试钻和补强</text>
<text x="1180.00" y="196.54" font-size="42" fill="#17252E" font-weight="700" text-anchor="start">第 2 片：完整留作备用</text>
<rect x="1225.00" y="290.00" width="390.00" height="390.00" fill="#F6F8F9" stroke="#566773" stroke-width="3"/>
<text x="1420.00" y="473.54" font-size="42" fill="#566773" font-weight="400" text-anchor="middle">500×500×3</text>
<text x="1420.00" y="527.54" font-size="42" fill="#566773" font-weight="400" text-anchor="middle">不必立即裁开</text>
<text x="1205.00" y="734.58" font-size="34" fill="#566773" font-weight="400" text-anchor="start">第二片缩小显示；尺寸同第一片。</text>
<text x="1160.00" y="828.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">先用第一片余料试切、试钻；</text>
<text x="1160.00" y="878.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">第二片留给补强、失败重做。</text>
<text x="1160.00" y="968.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">固定侧补强按实物裁；</text>
<text x="1160.00" y="1018.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">随盖补强仍须计入活动质量。</text>
<polyline points="790.00,1102.00 1090.00,1102.00 1140.00,1125.00" fill="none" stroke="#566773" stroke-width="3"/>
<polygon points="1140.00,1125.00 1125.00,1125.28 1130.46,1113.43" fill="#566773" stroke="none" stroke-width="3"/>
<text x="1160.00" y="1111.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">后固定条预留 150×12×3；</text>
<text x="1160.00" y="1159.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">试装后取宽 10～12。</text>
<text x="1160.00" y="1207.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">不是活动盖，不预钻铰链孔。</text>
<text x="140.00" y="1271.54" font-size="42" fill="#1565A6" font-weight="700" text-anchor="start">排料方法</text>
<text x="140.00" y="1333.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">① 边缘与片间均留至少 5；按标注的零件尺寸划线，刀或锯走余料一侧。</text>
<text x="140.00" y="1398.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">② 多次浅切，逐片修边；在余料上试钻，再标明“内 / 外 / 前 / 后”。</text>
<text x="140.00" y="1463.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">③ 面板、横梁与横杠为毛坯；无胶试拼通过后，按实际模块描孔。</text>
<text x="140.00" y="1521.58" font-size="34" fill="#566773" font-weight="400" text-anchor="start">按数字下料，不按打印图的大小切割。所有尺寸以现行手册及实物试装为准。</text>
</svg>