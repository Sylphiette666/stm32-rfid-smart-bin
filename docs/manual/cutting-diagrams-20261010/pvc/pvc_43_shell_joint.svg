<text x="990.00" y="1091.32" font-size="36" fill="#C33D3D" font-weight="400" text-anchor="start">红虚线 = P02 上表面</text>
<text x="990.00" y="1139.32" font-size="36" fill="#C33D3D" font-weight="400" text-anchor="start">四壁底缘与 P05 底面都落在此处。</text>
<text x="990.00" y="1218.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">底板不垫在四壁下面；</text>
<text x="990.00" y="1268.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">也不另加抬高底板的木条。</text>
<text x="990.00" y="1341.32" font-size="36" fill="#566773" font-weight="400" text-anchor="start">名义净口 154×144；</text>
<text x="990.00" y="1389.32" font-size="36" fill="#566773" font-weight="400" text-anchor="start">装角码、螺母后须重测实际通道。</text>
<polyline points="90.00,1400.00 1710.00,1400.00" fill="none" stroke="#DBE2E6" stroke-width="3"/>
<text x="90.00" y="1463.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">四壁试拼方正 → 两对角线差值目标≤2 → 底面齐平 → 内胆实际放入、取出。</text>
<text x="90.00" y="1521.58" font-size="34" fill="#566773" font-weight="400" text-anchor="start">采用外侧短角码或局部加强片；孔位按实物标记，不占用内胆全高度取出通道。</text>
