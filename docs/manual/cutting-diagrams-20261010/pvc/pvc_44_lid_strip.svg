<text x="45.00" y="71.76" font-size="48" fill="#17252E" font-weight="700" text-anchor="start">图解 44｜活动盖用 2 mm 新板；后固定条仍用 3 mm 余料</text>
<text x="45.00" y="134.32" font-size="36" fill="#566773" font-weight="400" text-anchor="start">单位 mm｜活动盖 P06 与固定压条是两件不同的零件；铰链让位和安装孔均按实物确定。</text>
