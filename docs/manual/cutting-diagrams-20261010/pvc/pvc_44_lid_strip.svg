<text x="398.50" y="589.02" font-size="46" fill="#1565A6" font-weight="700" text-anchor="middle">160×150×2</text>
<text x="445.00" y="865.95" font-size="35" fill="#566773" font-weight="400" text-anchor="middle">余料保留试切、试钻</text>
<text x="120.00" y="1003.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">160 沿车身 X；150 沿横向 Y。</text>
<text x="120.00" y="1068.06" font-size="38" fill="#17252E" font-weight="400" text-anchor="start">边缘修平、轻微圆角；先称裸盖。</text>
<text x="120.00" y="1161.54" font-size="42" fill="#1565A6" font-weight="700" text-anchor="start">裸盖目标 ≤30 g</text>
<text x="120.00" y="1223.06" font-size="38" fill="#C33D3D" font-weight="700" text-anchor="start">活动总成目标 ≤40 g；上限 45 g。</text>
<text x="120.00" y="1286.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">盖、随盖臂、活动补强、紧固件等</text>
<text x="120.00" y="1334.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">一起称量；取不出的活动铰链计入。</text>
<text x="970.00" y="196.54" font-size="42" fill="#17252E" font-weight="700" text-anchor="start">闭盖俯视：覆盖关系示意</text>
