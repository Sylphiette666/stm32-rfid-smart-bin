<text x="1640.00" y="765.20" font-size="35" fill="#1565A6" font-weight="400" text-anchor="middle">前伸约 5</text>
<text x="970.00" y="1111.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">盖后轴参考 X=75；固定条先试放</text>
<text x="970.00" y="1159.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">X=64～74，与盖留约 1 的缝。</text>
<text x="970.00" y="1226.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">条固定在后壁 / 外角件上，</text>
<text x="970.00" y="1274.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">不随盖运动、不承担连杆转矩。</text>
<text x="970.00" y="1341.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">孔位与让位口用真实铰链描出；</text>
<text x="970.00" y="1389.32" font-size="36" fill="#17252E" font-weight="400" text-anchor="start">手动全程开闭顺畅后再固定。</text>
<polyline points="90.00,1410.00 1710.00,1410.00" fill="none" stroke="#DBE2E6" stroke-width="3"/>
<text x="90.00" y="1473.06" font-size="38" fill="#566773" font-weight="400" text-anchor="start">1 mm PP 只用于五片内胆，不用于本图的固定壳、活动盖或后固定条。</text>
