<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200"><rect x="0" y="0" width="1800" height="2200" fill="white" stroke="none" stroke-width="3"/><text x="50.0" y="94.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="58" font-weight="700">49｜外置条件适配与选择跳帽</text><text x="50.0" y="156.0" fill="#687884" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">只对实物需要的分支施工；5 V 数据不能凭接口名字直接接 MCU。</text><text x="50.0" y="253.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700">A｜单路 5 V DO → 3.3 V 输入：外置 NPN 适配，会反相</text><text x="90.0" y="383.0" fill="#A96316" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="400">模块 DO</text><text x="90.0" y="436.0" fill="#A96316" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">0 / 5 V</text><polyline points="300,430 460,430" fill="none" stroke="#A96316" stroke-width="6" stroke-linejoin="round"/><polyline points="460,430 485,430" fill="none" stroke="#A96316" stroke-width="5" stroke-linejoin="round"/><rect x="485" y="413" width="140" height="34" fill="white" stroke="#A96316" stroke-width="4"/><polyline points="625,430 650,430" fill="none" stroke="#A96316" stroke-width="5" stroke-linejoin="round"/><text x="498.5" y="390.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="40" font-weight="400">10 kΩ</text><polyline points="650,430 820,430" fill="none" stroke="#196B9C" stroke-width="5" stroke-linejoin="round"/><circle cx="735" cy="430" r="7" fill="#196B9C"/><polyline points="820,355 820,505" fill="none" stroke="#30373B" stroke-width="7" stroke-linejoin="round"/><polyline points="820,390 965,305 965,280" fill="none" stroke="#30373B" stroke-width="5" stroke-linejoin="round"/><polyline points="820,472 965,560 965,600" fill="none" stroke="#30373B" stroke-width="5" stroke-linejoin="round"/><polyline points="879,509 949,550" fill="none" stroke="#30373B" stroke-width="5" stroke-linejoin="round"/><polygon points="949.00,550.00 931.06,548.56 938.97,535.05" fill="#30373B"/><text x="858.0" y="393.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">C</text><text x="755.0" y="427.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">B</text><text x="987.0" y="590.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">E</text><polyline points="965,280 1510,280" fill="none" stroke="#196B9C" stroke-width="6" stroke-linejoin="round"/><text x="1237.0" y="360.0" fill="#196B9C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">接对应一路输入</text><text x="1124.0" y="412.0" fill="#196B9C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">J33.4—9 / J31.3 BUSY</text><polyline points="1620,333 1620,353" fill="none" stroke="#23764D" stroke-width="5" stroke-linejoin="round"/><rect x="1603" y="353" width="34" height="95" fill="white" stroke="#23764D" stroke-width="4"/><polyline points="1620,448 1620,468" fill="none" stroke="#23764D" stroke-width="5" stroke-linejoin="round"/><text x="1582.0" y="416.5" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400"></text><text x="1464.0" y="524.0" fill="#23764D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">10 kΩ</text><polyline points="1510,280 1620,280 1620,333" fill="none" stroke="#196B9C" stroke-width="5" stroke-linejoin="round"/><polyline points="1620,468 1620,545" fill="none" stroke="#23764D" stroke-width="5" stroke-linejoin="round"/><circle cx="1620" cy="545" r="7" fill="#23764D"/><text x="1541.5" y="627.0" fill="#23764D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">3V3_EXT</text><polyline points="735,430 735,475" fill="none" stroke="#196B9C" stroke-width="5" stroke-linejoin="round"/><polyline points="735,475 735,495" fill="none" stroke="#196B9C" stroke-width="5" stroke-linejoin="round"/><rect x="718" y="495" width="34" height="80" fill="white" stroke="#196B9C" stroke-width="4"/><polyline points="735,575 735,595" fill="none" stroke="#196B9C" stroke-width="5" stroke-linejoin="round"/><text x="563.0" y="551.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">100 kΩ</text><polyline points="735,595 735,609" fill="none" stroke="#30373B" stroke-width="4" stroke-linejoin="round"/><polyline points="713.0,609 757.0,609" fill="none" stroke="#30373B" stroke-width="4" stroke-linejoin="round"/><polyline points="721.0,618 749.0,618" fill="none" stroke="#30373B" stroke-width="4" stroke-linejoin="round"/><polyline points="729.0,627 741.0,627" fill="none" stroke="#30373B" stroke-width="4" stroke-linejoin="round"/><polyline points="965,600 965,614" fill="none" stroke="#30373B" stroke-width="4" stroke-linejoin="round"/><polyline points="943.0,614 987.0,614" fill="none" stroke="#30373B" stroke-width="4" stroke-linejoin="round"/><polyline points="951.0,623 979.0,623" fill="none" stroke="#30373B" stroke-width="4" stroke-linejoin="round"/><polyline points="959.0,632 971.0,632" fill="none" stroke="#30373B" stroke-width="4" stroke-linejoin="round"/><text x="1020.0" y="503.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="700">2N3904</text><text x="90.0" y="702.0" fill="#687884" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="38" font-weight="400">每个 DO 单独适配；DO 高→C低，DO 低→C高。脚序按实物核对。</text><polyline points="50,742 1750,742" fill="none" stroke="#CAD4DA" stroke-width="3" stroke-linejoin="round"/><text x="50.0" y="817.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700">B｜DHT 必须 5 V 时：外置 BSS138 双向开漏转换</text><text x="50.0" y="880.0" fill="#A96316" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">JP7＝2–3；JP8 保持开路。DHT 本体仍接 J22。</text><rect x="70" y="924" width="520" height="460" fill="#F4F7F9" stroke="#182C39" stroke-width="3"/><text x="235.0" y="989.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="44" font-weight="700">PCB  J23</text><rect x="1130" y="924" width="600" height="460" fill="#F4F7F9" stroke="#182C39" stroke-width="3"/><text x="1212.5" y="987.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="42" font-weight="700">外置 BSS138 成品模块</text><text x="110.0" y="1052.0" fill="#23764D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">1  3V3_EXT</text><text x="1170.0" y="1054.0" fill="#23764D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">LV</text><polyline points="590,1040 1130,1040" fill="none" stroke="#23764D" stroke-width="5" stroke-linejoin="round"/><text x="110.0" y="1122.0" fill="#B8383B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">2  5V_BUS</text><text x="1170.0" y="1124.0" fill="#B8383B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">HV</text><polyline points="590,1110 1130,1110" fill="none" stroke="#B8383B" stroke-width="5" stroke-linejoin="round"/><text x="110.0" y="1192.0" fill="#30373B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">3  GND</text><text x="1170.0" y="1194.0" fill="#30373B" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">GND</text><polyline points="590,1180 1130,1180" fill="none" stroke="#30373B" stroke-width="5" stroke-linejoin="round"/><text x="110.0" y="1262.0" fill="#196B9C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">4  PB11</text><text x="1170.0" y="1264.0" fill="#196B9C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">LV1</text><polyline points="590,1250 1130,1250" fill="none" stroke="#196B9C" stroke-width="5" stroke-linejoin="round"/><polyline points="790,1250 880,1250" fill="none" stroke="#196B9C" stroke-width="4" stroke-linejoin="round"/><polygon points="880.00,1250.00 868.29,1255.65 868.29,1244.35" fill="#196B9C"/><polyline points="880,1250 790,1250" fill="none" stroke="#196B9C" stroke-width="4" stroke-linejoin="round"/><polygon points="790.00,1250.00 801.71,1244.35 801.71,1255.65" fill="#196B9C"/><text x="110.0" y="1332.0" fill="#196B9C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">5  DHT_DATA_RAW</text><text x="1170.0" y="1334.0" fill="#196B9C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">HV1</text><polyline points="590,1320 1130,1320" fill="none" stroke="#196B9C" stroke-width="5" stroke-linejoin="round"/><polyline points="790,1320 880,1320" fill="none" stroke="#196B9C" stroke-width="4" stroke-linejoin="round"/><polygon points="880.00,1320.00 868.29,1325.65 868.29,1314.35" fill="#196B9C"/><polyline points="880,1320 790,1320" fill="none" stroke="#196B9C" stroke-width="4" stroke-linejoin="round"/><polygon points="790.00,1320.00 801.71,1314.35 801.71,1325.65" fill="#196B9C"/><text x="50.0" y="1459.0" fill="#687884" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">J23.5 与 J22.3 是同一 DATA 网；不短接 JP8 绕过转换器。</text><text x="50.0" y="1522.0" fill="#23764D" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">若实物支持 3.3 V：JP7＝1–2、JP8 闭合，不接此转换模块。</text><polyline points="50,1562 1750,1562" fill="none" stroke="#CAD4DA" stroke-width="3" stroke-linejoin="round"/><text x="50.0" y="1636.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="43" font-weight="700">C｜蜂鸣器：控制电平与模块供电分开选择</text><text x="243.0" y="1712.0" fill="#196B9C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">JP3 选 1–2：3.3 V 控制</text><text x="1129.0" y="1712.0" fill="#196B9C" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">JP3 选 2–3：5 V 控制</text><rect x="220" y="1741" width="460" height="68" fill="#F4F7F9" stroke="#CAD4DA" stroke-width="3"/><rect x="245" y="1760" width="30" height="30" fill="white" stroke="#196B9C" stroke-width="4"/><text x="207.5" y="1848.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400">1  PB9</text><rect x="435" y="1760" width="30" height="30" fill="white" stroke="#196B9C" stroke-width="4"/><text x="410.5" y="1848.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400">2  IN</text><rect x="625" y="1760" width="30" height="30" fill="white" stroke="#196B9C" stroke-width="4"/><text x="572.0" y="1848.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400">3  AHCT</text><rect x="234" y="1745" width="242" height="60" fill="none" stroke="#A96316" stroke-width="7"/><rect x="1090" y="1741" width="460" height="68" fill="#F4F7F9" stroke="#CAD4DA" stroke-width="3"/><rect x="1115" y="1760" width="30" height="30" fill="white" stroke="#196B9C" stroke-width="4"/><text x="1077.5" y="1848.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400">1  PB9</text><rect x="1305" y="1760" width="30" height="30" fill="white" stroke="#196B9C" stroke-width="4"/><text x="1280.5" y="1848.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400">2  IN</text><rect x="1495" y="1760" width="30" height="30" fill="white" stroke="#196B9C" stroke-width="4"/><text x="1442.0" y="1848.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="35" font-weight="400">3  AHCT</text><rect x="1294" y="1745" width="242" height="60" fill="none" stroke="#A96316" stroke-width="7"/><text x="50.0" y="1937.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">每组只能一只跳帽；JP4 另按模块额定电压选 3.3 V 或 5 V。</text><text x="50.0" y="2002.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">R36 下拉：高有效；R37 上拉 CORE：低有效。两者只装一只。</text><text x="50.0" y="2067.0" fill="#182C39" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="39" font-weight="400">即使不接蜂鸣，也保留其中一只偏置，避免 AHCT 输入浮空。</text><text x="50.0" y="2150.0" fill="#687884" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="37" font-weight="400">上述均是条件接线示意；不是商品模块排针顺序，也不替代断电通断检查。</text></svg>